# Фонд Святителей земли русской — статический сайт
# /etc/nginx/sites-available/fond-svyatiteley
#
# ВАЖНО: в nginx add_header внутри location полностью заменяет заголовки,
# унаследованные от server. Поэтому все заголовки собраны в сниппете
# snippets/fond-headers.conf и включаются в каждый location через include.

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;

    root /var/www/fond-svyatiteley;
    index index.html;

    charset utf-8;
    server_tokens off;

    include snippets/fond-headers.conf;

    # Сжатие
    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/json application/xml
        application/rss+xml application/manifest+json
        image/svg+xml font/ttf font/otf;

    # Проверка домена при выпуске сертификата Let's Encrypt.
    # Префикс ^~ важен: иначе путь перехватит правило «не отдавать скрытые файлы».
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
        try_files $uri =404;
    }

    # HTML — всегда сверяем с сервером, чтобы правки были видны сразу
    location = / {
        include snippets/fond-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }

    location ~* \.html$ {
        include snippets/fond-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Шрифты, картинки, видео — не меняются, держим в кэше долго
    location ~* \.(woff2|woff|ttf|otf|eot|webp|avif|png|jpe?g|gif|ico|svg|mp4|webm)$ {
        include snippets/fond-headers.conf;
        add_header Cache-Control "public, max-age=2592000" always;
        access_log off;
        try_files $uri =404;
    }

    # Сторонние библиотеки — версия зафиксирована, кэшируем долго.
    # Префикс ^~ нужен, чтобы правило не перехватила регулярка на .js ниже.
    location ^~ /vendor/ {
        include snippets/fond-headers.conf;
        add_header Cache-Control "public, max-age=2592000" always;
        access_log off;
        try_files $uri =404;
    }

    # Свой CSS и JS — короткий кэш плюс сверка по ETag
    location ~* \.(css|js)$ {
        include snippets/fond-headers.conf;
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
        try_files $uri =404;
    }

    location = /robots.txt {
        include snippets/fond-headers.conf;
        access_log off;
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location = /favicon.ico {
        include snippets/fond-headers.conf;
        add_header Cache-Control "public, max-age=2592000" always;
        access_log off;
        log_not_found off;
        try_files /assets/img/favicon-32.png =404;
    }

    # Не отдаём скрытые файлы и исходники
    location ~ /\. { deny all; }
    location ~* \.(mjs|map|md|docx|zip|log|sh|py|json)$ { deny all; }

    # Одностраничник: неизвестный путь ведём на главную
    error_page 404 = @home;
    location @home { return 302 /; }

    location / {
        include snippets/fond-headers.conf;
        try_files $uri $uri/ =404;
    }
}
