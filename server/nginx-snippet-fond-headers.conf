# Общие заголовки сайта фонда. Включается через include в server и в каждый
# location, где есть свой add_header — иначе nginx их не наследует.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

# Сайт открывается по IP и остаётся черновиком: поисковикам не отдаём.
# Когда появится домен — завести отдельный server-блок на домен,
# который включает этот сниппет без строки X-Robots-Tag.
add_header X-Robots-Tag "noindex, nofollow" always;
